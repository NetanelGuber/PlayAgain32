name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Build native runtime from source
        shell: pwsh
        run: ./tools/build-android.ps1 -RustToolchain 1.99.1-x86_64-pc-windows-gnu -NativeOnly
      - name: Test, lint and assemble development APK
        shell: pwsh
        run: ./tools/test.ps1 -RustToolchain 1.99.1-x86_64-pc-windows-gnu
      - name: Verify APK signature and alignment
        shell: pwsh
        run: |
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0'
          $apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose $apk
          if ($LASTEXITCODE) { throw 'APK signature verification failed.' }
          & (Join-Path $buildTools 'zipalign.exe') -c -P 16 4 $apk
          if ($LASTEXITCODE) { throw 'APK alignment verification failed.' }
          python tools/verify_apk.py $apk
          if ($LASTEXITCODE) { throw 'APK privacy verification failed.' }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-and-lint-reports
          path: android/app/build/reports/
          retention-days: 14
      - name: Upload development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PlayAgain32-development
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
